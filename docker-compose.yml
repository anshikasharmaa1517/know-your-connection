services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3000:3000"   # FalkorDB Browser: look at the graphs while you demo
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  app:
    build: .
    depends_on:
      - falkordb
    ports:
      - "8000:8000"
    environment:
      FALKORDB_URL: redis://falkordb:6379
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      CONNECTIONS_PUBLIC_URL: ${CONNECTIONS_PUBLIC_URL:-http://localhost:8000}

volumes:
  falkordb-data:
